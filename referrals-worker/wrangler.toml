name = "freefinder-referrals"
main = "src/index.js"
compatibility_date = "2026-03-09"

[vars]
TIKTOK_EXPECTED_USERNAME = "freefinder.at"
TIKTOK_REDIRECT_URI = "https://freefinder-referrals.freefinder-stefan.workers.dev/api/social/tiktok/callback"
INSTAGRAM_EXPECTED_USERNAME = "freefinder.at"
INSTAGRAM_REDIRECT_URI = "https://freefinder-referrals.freefinder-stefan.workers.dev/api/social/instagram/callback"
INSTAGRAM_GRAPH_API_VERSION = "v26.0"
META_DISCOVERY_WATCHDOG_ENABLED = "1"
DAILY_PUSH_ENABLED = "0"

[triggers]
crons = ["8,23,38,53 * * * *", "0 7,8 * * *"]

[[durable_objects.bindings]]
name = "DAILY_DEAL_PUSH"
class_name = "DailyDealPush"

[[migrations]]
tag = "daily-push-v1"
new_sqlite_classes = ["DailyDealPush"]

[[kv_namespaces]]
binding = "REFERRAL_KV"
id = "a9e89926db014692adccdd2cf8272d2b"
preview_id = "a5e0b2f7311e42a2afde0b859f911a45"
