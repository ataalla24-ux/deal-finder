name = "freefinder-merchant-backend"
main = "src/index.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["5,20,35,50 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
ACCOUNTS_ENABLED = "1"
ACCOUNT_EMAIL_ENABLED = "1"
ACCOUNT_EMAIL_TRANSPORT_ENABLED = "1"
ACCOUNT_EMAIL_QA_ENABLED = "0"
STORE_TEST_RECEIPTS_ENABLED = "0"
FIREBASE_PROJECT_ID = "earnest-sandbox-487113-g8"
APP_STORE_BUNDLE_ID = "com.stefanataalla.freefinderwien"
REFERRAL_MONTHS_ENABLED = "1"
REFERRAL_PLAY_DEFERRAL_ENABLED = "1"
REFERRAL_PLAY_REWARD_SUBSCRIPTION_ENABLED = "1"
REFERRAL_PLAY_REWARD_BASE_PLAN = "monthly"
REFERRAL_APPLE_REWARD_SUBSCRIPTION_ENABLED = "1"
REFERRAL_APPLE_ATTESTED_CLAIMS_ENABLED = "1"
REFERRAL_APPLE_LEGACY_BINDING_ENABLED = "1"
APP_ATTEST_REVIEW_KEY_COUNT = "10"
REFERRAL_RECONCILIATION_ENABLED = "1"
REFERRAL_SUPPORT_ENABLED = "0"

[[kv_namespaces]]
binding = "MERCHANT_CAMPAIGNS"
id = "2c6156c0bb9a41c7afd5e87b199904ec"

[[durable_objects.bindings]]
name = "MERCHANT_PROMOS"
class_name = "MerchantPromoLedger"

[[migrations]]
tag = "merchant-promos-v1"
new_sqlite_classes = ["MerchantPromoLedger"]

[[durable_objects.bindings]]
name = "REFERRAL_MONTHS"
class_name = "ReferralMonths"

[[migrations]]
tag = "referral-months-v1"
new_sqlite_classes = ["ReferralMonths"]
