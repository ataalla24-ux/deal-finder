name: Free local coupon OCR tools
description: Install open-source tools only when coupon evidence needs verification
inputs:
  force:
    description: Collector always needs the tools
    default: 'false'
runs:
  using: composite
  steps:
    - id: need
      shell: bash
      env:
        FORCE_COUPON_TOOLS: ${{ inputs.force }}
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import { inspectCouponTools } from './scripts/coupon-tools-preflight.mjs';
        let needed = process.env.FORCE_COUPON_TOOLS === 'true';
        for (const f of fs.readdirSync('docs').filter(f=>/^deals-pending.*\.json$/.test(f))) {
          const b = JSON.parse(fs.readFileSync('docs/'+f,'utf8'));
          if ((Array.isArray(b)?b:b.deals||[]).some(d=>d.evidence?.media)) needed = true;
        }
        const inspection = inspectCouponTools();
        const installed = inspection.available;
        if (installed) needed = false;
        fs.appendFileSync(process.env.GITHUB_OUTPUT,`needed=${needed}\npackages=${inspection.packages.join(' ')}\n`);
        NODE
    - if: steps.need.outputs.needed == 'true'
      shell: bash
      env:
        MISSING_COUPON_PACKAGES: ${{ steps.need.outputs.packages }}
      run: |
        if ! timeout --kill-after=10s 60s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq; then
          echo '::warning::Coupon package index unavailable; verification will check actual tools.'
        fi
        read -r -a packages <<< "$MISSING_COUPON_PACKAGES"
        if ! timeout --kill-after=10s 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends "${packages[@]}"; then
          echo '::warning::Coupon tools incomplete; media-dependent offers must wait, other offers may proceed.'
        fi
    - name: Publish actual media verification capability
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import { inspectCouponTools } from './scripts/coupon-tools-preflight.mjs';
        const result = inspectCouponTools();
        fs.appendFileSync(process.env.GITHUB_ENV, `COUPON_TOOLS_AVAILABLE=${result.available ? '1' : '0'}\n`);
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.available
          ? 'Coupon media tools ready.\n' : 'Coupon media verification deferred: missing ' + result.packages.join(', ') + '. No media offer may bypass verification.\n');
        NODE
