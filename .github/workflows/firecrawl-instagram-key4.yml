name: "Firecrawl Key 4 - Gastro Discovery"

on:
  schedule:
    - cron: '0 7 * * *' # Run after Firecrawl Keys 1-3 and 5, before the daily digest
  workflow_dispatch:

concurrency:
  group: firecrawl-instagram-key4
  cancel-in-progress: false

jobs:
  gastro:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Gastro Scraper
        env:
          FIRECRAWL_API_KEY4: ${{ secrets.FIRECRAWL_API_KEY4 }}
          FIRECRAWL_POST_VERIFY_MAX: 60
          FIRECRAWL_POST_VERIFY_MAX_AGE_DAYS: 7
          FIRECRAWL_POST_MAX_ACCEPTED_AGE_DAYS: 7
          FIRECRAWL_POST_VERIFY_CONCURRENCY: 4
          FIRECRAWL_POST_VERIFY_TIMEOUT_MS: 6000
          FIRECRAWL4_MAX_CREDITS_PER_TARGET: 350
        run: node scraper/firecrawl-instagram-direct4.js

      - name: Commit deals
        run: |
          node scripts/commit-generated.mjs --message "Firecrawl4 deals $(date +%Y-%m-%d)" --files docs/deals-pending-firecrawl4.json docs/deal-pipeline-last-run-firecrawl4.json docs/deal-pipeline-runs-firecrawl4.json
