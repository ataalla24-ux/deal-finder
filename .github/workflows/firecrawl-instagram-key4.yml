name: "Firecrawl Key 4 - Instagram Direct"

on:
  schedule:
    - cron: '0 7 * * *' # Run after Firecrawl Keys 1-3 and 5, before the daily digest
  workflow_dispatch:

concurrency:
  group: firecrawl-instagram-key4
  cancel-in-progress: false

jobs:
  instagram-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Instagram Direct Scraper
        env:
          FIRECRAWL_API_KEY4: ${{ secrets.FIRECRAWL_API_KEY4 }}
          FC4_MAX_AGE_DAYS: 7
          FC4_DISCOVERY_MAX_AGE_DAYS: 14
          FC4_RECURRING_MAX_AGE_DAYS: 45
          FC4_MAX_DEALS: 160
          FC4_MAX_REVIEW: 160
          FC4_SEARCH_LIMIT: 6
          FC4_PROFILE_QUERY_LIMIT: 18
          FC4_TARGET_ACCOUNT_LIMIT: 30
          FC4_MAX_POSTS_TO_SCRAPE: 160
          FC4_SEARCH_CONCURRENCY: 2
          FC4_SCRAPE_CONCURRENCY: 4
          FC4_AGENT_DISCOVERY_ENABLED: "true"
          FC4_AGENT_SOURCE_LIMIT: 4
          FC4_AGENT_CONCURRENCY: 2
          FC4_AGENT_TIMEOUT_SECONDS: 240
          FC4_AGENT_MODEL: spark-1-pro
          FC4_MAX_FIRECRAWL_CALLS: 140
        run: node scraper/firecrawl-instagram-direct4.js

      - name: Commit deals
        run: |
          node scripts/commit-generated.mjs --message "Firecrawl4 deals $(date +%Y-%m-%d)" --files docs/deals-pending-firecrawl4.json docs/deals-raw-firecrawl4.json docs/deals-review-firecrawl4.json docs/deals-rejected-firecrawl4.json docs/deal-pipeline-last-run-firecrawl4.json docs/deal-pipeline-runs-firecrawl4.json
