name: Instagram Graph Coverage Tests

on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'scripts/review-live-deals-llm.mjs'
      - 'scripts/test-source-review-cache.mjs'
      - '.github/workflows/daily-deal-pick.yml'
      - '.github/workflows/validate-live-deals.yml'
      - 'scripts/test-apify*'
      - '.github/workflows/apify-discovery.yml'
      - 'scripts/test-slack-food-improvements.mjs'
      - 'scripts/test-review-clarity.mjs'
      - 'scripts/test-instagram-media-budget.mjs'
      - 'scripts/test-instagram-max-coverage.mjs'
      - 'scripts/test-meta-instagram-deals.mjs'
      - 'scripts/check-meta-instagram-graph.mjs'
      - 'scripts/test-meta-token-health.mjs'
      - 'scripts/apply-reviewed-deal-copy.mjs'
      - 'scripts/test-reviewed-deal-copy.mjs'
      - 'scripts/test-*card-editor*'
      - '.github/workflows/card-editor-check.yml'
      - 'scripts/notify-meta-instagram-health.mjs'
      - 'scripts/test-meta-instagram-health-alert.mjs'
      - '.github/workflows/instagram-graph-coverage-tests.yml'
      - '.github/workflows/meta-instagram-deals.yml'
      - '.github/workflows/daily-digest.yml'
  pull_request:
    paths:
      - 'scripts/test-review-clarity.mjs'
      - 'scraper/**'
      - 'scripts/review-live-deals-llm.mjs'
      - 'scripts/test-source-review-cache.mjs'
      - '.github/workflows/daily-deal-pick.yml'
      - '.github/workflows/validate-live-deals.yml'
      - 'scripts/test-apify*'
      - '.github/workflows/apify-discovery.yml'
      - 'scripts/test-instagram-graph*.mjs'
      - 'scripts/test-instagram-shared-quota.mjs'
      - 'scripts/test-instagram-media-budget.mjs'
      - 'scripts/test-instagram-max-coverage.mjs'
      - 'scripts/test-meta-token-health.mjs'
      - 'scripts/apply-reviewed-deal-copy.mjs'
      - 'scripts/test-reviewed-deal-copy.mjs'
      - 'scripts/test-*card-editor*'
      - '.github/workflows/card-editor-check.yml'
      - 'scripts/notify-meta-instagram-health.mjs'
      - 'scripts/test-meta-instagram-health-alert.mjs'
      - 'scripts/test-meta-ad-coverage.mjs'
      - 'scripts/test-meta-recall.mjs'
      - 'scripts/test-discovery-watchdog.mjs'
      - 'referrals-worker/**'
      - 'scripts/check-meta-instagram-graph.mjs'
      - '.github/workflows/daily-digest.yml'
      - 'scripts/test-meta-instagram-deals.mjs'
      - 'scripts/test-wien-deals-combined.mjs'
      - '.github/workflows/*instagram*'
      - '.github/workflows/wien-deals-combined.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test pagination and both collector integrations without network credentials
        run: |
          node --test scripts/test-source-review-cache.mjs
          SENTRY_DISABLED=1 node --test scripts/test-community-card-enrichment.mjs
          node scripts/test-slack-food-improvements.mjs
          node scripts/test-review-clarity.mjs
          node scripts/test-deal-evidence.mjs
          node scripts/test-slack-deal-quality.mjs
          node scripts/test-deal-review-feedback.mjs
          node scripts/test-apify-instagram-reliability.mjs
          node --test scripts/test-apify-discovery.mjs scripts/test-apify-food-discovery.mjs
          node scripts/test-instagram-max-coverage.mjs
          node scripts/test-instagram-media-budget.mjs
          node scripts/test-meta-token-health.mjs
          node scripts/test-meta-instagram-health-alert.mjs
          node scripts/test-reviewed-deal-copy.mjs
          node --test scripts/test-deal-card-editor.mjs scripts/test-card-editor-v2.mjs scripts/test-card-editor-retry.mjs scripts/test-card-editor-disabled.mjs
          node scripts/test-instagram-entity-resolution.mjs
          node scripts/test-slack-approval-validation.mjs
          npm run test:instagram-shared-quota
          npm run test:meta-ad-coverage
          npm run test:meta-recall
          npm run test:discovery-watchdog
          npm run test:instagram-media-evidence
          npm run test:social-food-audit
          npm run test:social-food-slack-review
          npm run test:instagram-food-discovery
          npm run test:instagram-graph-scan
          node scripts/test-meta-instagram-deals.mjs
          npm run test:wien-deals-combined
          npm run test:instagram-graph-refresh

  quota-storage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared quota storage without calling Instagram
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { githubQuotaStore } from './scraper/instagram-shared-quota.js';
          const store = githubQuotaStore(process.env);
          const { state } = await store.read();
          console.log(JSON.stringify({ storage: 'available', pausedUntil: new Date(state.pausedUntil).toISOString(), reservations: state.reservations.length }));
          JS
