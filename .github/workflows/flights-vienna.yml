name: "Flights Vienna Scraper"

on:
  schedule:
    - cron: '0 7 * * 1' # Weekly on Monday, aligned with the early-morning digest window
  workflow_dispatch:

concurrency:
  group: deal-pending-all-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Scrape cheap roundtrip flights from Vienna
        env:
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
        run: node scraper/flights-vienna-scraper.js

      - name: Send fresh flight deals to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PENDING_FILE_NAMES: deals-pending-flights.json
        run: node scraper/slack-notify.js

      - name: Commit flight scanner state
        if: always()
        run: |
          node scripts/commit-generated.mjs --message "Flights Vienna deals" --files docs/deals-pending-flights.json docs/deals-pending-all.json docs/deal-validity-report.json
