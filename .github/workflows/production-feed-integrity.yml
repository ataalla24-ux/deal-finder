name: "Production Feed Integrity"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/deals.json"
      - "docs/deal-map-locations.json"
      - "docs/deal-of-the-day.json"
      - "docs/deal-of-the-week.json"
      - "scripts/validate-production-feed.mjs"
      - "scripts/validate-deal-map-locations.mjs"
      - "scripts/deal-map-enrichment.mjs"
      - "scripts/enrich-deal-map.mjs"
      - "scripts/test-deal-map-enrichment.mjs"
      - "scripts/deal-map-*.mjs"
      - "scripts/test-map-*.mjs"
      - "scripts/test-deal-map-*.mjs"
      - "scripts/test-slack-business-map-review.mjs"
      - "scripts/commit-generated.mjs"
      - "scripts/validate-map-coverage.mjs"
      - "scraper/deal-normalization-utils.js"
      - "scripts/cache-deal-logos.mjs"
      - "scripts/test-deal-logo-normalization.mjs"
      - "scraper/deal-content-quality-utils.js"
      - "scraper/deal-validity-agent.js"
      - "scraper/expiry-utils.js"
      - "scraper/deal-evidence-utils.js"
      - "scraper/offer-period-fields.js"
      - "scripts/test-slack-date-pipeline.mjs"
      - "scraper/normalize-live-deals.js"
      - "scraper/slack-digest-utils.js"
      - "scraper/slack-notify.js"
      - "scraper/deal-discovery-policy.js"
      - "scraper/social-food-audit-utils.js"
      - "scripts/test-slack-delivery-state.mjs"
      - "scripts/test-discovery-non-consumer-offers.mjs"
      - "scripts/test-generated-state-merge.mjs"
      - "scraper/ai-credit-budget.js"
      - "scripts/automatic-deal-maintenance.mjs"
      - "scripts/server-quality-audit.mjs"
      - "scripts/vienna-quality-slot.mjs"
      - "scripts/test-server-quality.mjs"
      - "scraper/source-backed-quality.js"
      - "scraper/community-extraction.js"
      - "scraper/fetch-community-submissions.js"
      - ".github/workflows/server-deal-quality.yml"
      - ".github/workflows/server-quality-publication.yml"
      - "scripts/test-server-quality-publication-workflow.mjs"
      - "scripts/automatic-maintenance-review.mjs"
      - "scripts/test-ai-credit-budget.mjs"
      - "scripts/test-automatic-maintenance.mjs"
      - "scraper/offer-title-utils.js"
      - "scraper/pre-publication-title.js"
      - "scripts/test-pre-publication-title.mjs"
      - "scripts/test-offer-title.mjs"
      - "scripts/polish-live-deal-titles.mjs"
      - "scraper/public-deal-text.js"
      - "scripts/test-public-deal-text.mjs"
      - "scripts/deals-feed-contract.mjs"
      - "scripts/deal-redemptions.mjs"
      - "scripts/test-deal-redemptions.mjs"
      - "reviews/deal-redemptions.json"
      - "scripts/live-deal-edits-lib.mjs"
      - "scripts/*deal-photo*.mjs"
      - "docs/assets/approved-deal-photos/**"
      - "reviews/deal-photos/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-live-flight-price.mjs"
      - "scripts/test-source-backed-content.mjs"
      - "scripts/apply-reviewed-content.mjs"
      - "reviews/**"
      - "scraper/firecrawl-search-*.js"
      - "scraper/firecrawl-gastro2.js"
      - "scraper/firecrawl-food3.js"
      - "scraper/firecrawl-instagram-direct4.js"
      - "scripts/test-firecrawl-*.mjs"
      - ".github/workflows/firecrawl-gastro-key1.yml"
      - ".github/workflows/production-feed-integrity.yml"

permissions:
  contents: read

jobs:
  validate-production-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Validate live feed contract
        run: npm run test:feed-contract

      - name: Validate reviewed in-app redemption details
        run: |
          node scripts/test-deal-redemptions.mjs
          node --test scripts/test-server-quality-publication-workflow.mjs

      - name: Protect source-backed content and manual review
        env:
          SENTRY_DISABLED: '1'
        run: |
          node scripts/test-source-backed-content.mjs
          node scripts/test-public-deal-text.mjs
          node scripts/test-offer-title.mjs
          node scripts/test-pre-publication-title.mjs
          node scripts/test-deal-logo-normalization.mjs
          node scripts/test-live-deal-removal-safety.mjs
          node scripts/test-live-flight-price.mjs
          node scripts/test-deal-photo-contract.mjs
          node --test scripts/test-original-deal-photos.mjs
          node scripts/validate-original-deal-photos.mjs
          node scripts/test-slack-deal-quality.mjs
          node scripts/test-slack-approval-validation.mjs
          node scripts/test-slack-date-pipeline.mjs
          node scripts/test-expiry-normalization.mjs
          node scripts/test-deal-validity-evidence.mjs
          node scripts/test-slack-delivery-state.mjs
          node scripts/test-discovery-non-consumer-offers.mjs
          node scripts/test-map-location-classification.mjs
          node scripts/test-generated-state-merge.mjs
          node --test scripts/test-ai-credit-budget.mjs scripts/test-automatic-maintenance.mjs
          node --test scripts/test-server-quality.mjs
          node scripts/test-community-extraction.mjs
          node scripts/test-community-card-enrichment.mjs

      - name: Protect bounded food discovery
        run: |
          node scripts/test-firecrawl-search-client.mjs
          node scripts/test-firecrawl-search-utils.mjs
          node scripts/test-firecrawl-agent-utils.mjs
          node --test scripts/test-firecrawl-sdk-compatibility.mjs
          node scripts/test-firecrawl-instagram-direct4.mjs
          node scripts/test-firecrawl-post-verifier.mjs

      - name: Validate production feed and derived data
        run: npm run test:production-feed

      - name: Validate map coverage contract
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-deal-map-enrichment.mjs
          node scripts/test-map-location-pipeline.mjs
          node scripts/test-map-geocode-fairness.mjs
          node scripts/test-deal-map-source-addresses.mjs
          node scripts/test-deal-map-business.mjs
          node scripts/test-map-commit-consistency.mjs
          node scripts/test-deal-map-review.mjs
          node scripts/test-slack-business-map-review.mjs
          npm run test:deal-map
