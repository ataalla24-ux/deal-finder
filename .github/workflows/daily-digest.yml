name: "Central Deal Dispatch"
# Collectors only write source-specific pending files. This workflow is the
# single writer that validates, deduplicates and publishes deals to Slack.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Meta Instagram Deal Discovery"
      - "Apify Instagram Fresh Scan"
      - "Instagram AI Agent"
      - "TikTok Deal Scanner"
      - "Wien Deals Combined"
      - "Power Scraper"
      - "Flights Vienna Scraper"
      - "Gutscheine.at Scraper"
      - "Member Benefits Scraper"
      - "Firecrawl Daily Sync"
      - "Firecrawl Key 1 - Gastro"
      - "Firecrawl Key 2 - Food"
      - "Firecrawl Key 3 - Consumables"
      - "Firecrawl Key 4 - Gastro Discovery"
      - "Firecrawl Key 5 - Instagram Gastro"
      - "Freikirchen Wien"
      - "⛪ Churches Wien Scraper"
    types: [completed]

concurrency:
  group: deal-state-writer
  cancel-in-progress: false

jobs:
  dispatch-deals:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Refresh Instagram merchant registry
        run: npm run instagram:merchant-registry

      - name: Verify fresh Instagram candidates via Graph API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          INSTAGRAM_GRAPH_VERIFY_MAX_ACCOUNTS: "24"
          INSTAGRAM_GRAPH_VERIFY_MEDIA_PER_ACCOUNT: "25"
          INSTAGRAM_GRAPH_VERIFY_MAX_AGE_DAYS: "7"
        run: npm run instagram:graph:verify

      - name: Reverify Firecrawl outputs
        env:
          FIRECRAWL_POST_VERIFY_MAX: "80"
          FIRECRAWL_POST_VERIFY_CONCURRENCY: "4"
          FIRECRAWL_POST_VERIFY_TIMEOUT_MS: "6000"
        run: npm run firecrawl:reverify

      - name: Build Deal Source Health
        run: node scraper/build-deal-source-health.js

      - name: Send validated new deals to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_SEEN_CACHE_MAX_AGE_MINUTES: "10"
          FIRECRAWL_REVIEW_ENABLED: "1"
          FIRECRAWL_REVIEW_MAX_PER_SOURCE: "10"
          FIRECRAWL_REVIEW_MAX_TOTAL: "30"
          FIRECRAWL_REVIEW_MAX_AGE_DAYS: "7"
        run: node scraper/slack-notify.js

      - name: Mark posted community submissions as queued
        env:
          COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
        run: node scraper/ack-community-submissions.js

      - name: Commit dispatch state
        if: always()
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "Central deal dispatch $(date +%Y-%m-%dT%H:%MZ)" --files docs/deals-pending-all.json docs/deals-pending-gastro2.json docs/deals-pending-food3.json docs/deals-pending-firecrawl2.json docs/deals-pending-firecrawl4.json docs/deals-pending-firecrawl5.json docs/deal-candidates-index.json docs/deal-source-health.json docs/deal-validity-report.json docs/instagram-merchant-registry.json docs/instagram-graph-post-evidence.json docs/instagram-graph-verification-report.json docs/slack-seen-posts.json
