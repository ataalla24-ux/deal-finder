name: "Central Deal Dispatch"
# Collectors only write source-specific pending files. This workflow is the
# single writer that validates, deduplicates and publishes deals to Slack.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Community Deal Intake"
      - "Meta Instagram Deal Discovery"
      - "Apify Instagram Fresh Scan"
      - "Instagram AI Agent"
      - "TikTok Deal Scanner"
      - "Wien Deals Combined"
      - "Power Scraper"
      - "Vienna Merchant Discovery"
      - "Flights Vienna Scraper"
      - "Gutscheine.at Scraper"
      - "Member Benefits Scraper"
      - "Firecrawl Daily Sync"
      - "Firecrawl Key 1 - Gastro"
      - "Firecrawl Key 2 - Food"
      - "Firecrawl Key 3 - Consumables"
      - "Firecrawl Key 4 - Gastro Discovery"
      - "Firecrawl Key 5 - Instagram Gastro"
      - "Freikirchen Wien"
      - "⛪ Churches Wien Scraper"
    types: [completed]

concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  dispatch-deals:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.display_title != 'Meta Graph health audit' && github.event.workflow_run.display_title != 'Wien Combined validation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check whether Wien Combined deferred
        id: wien-combined
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Wien Deals Combined' }}
        env:
          WIEN_COMBINED_RUN_ID: ${{ github.event.workflow_run.id }}
          WIEN_COMBINED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const history = JSON.parse(readFileSync('docs/deal-pipeline-runs-wien-combined.json', 'utf8'));
          const run = history.runs.find(({ runProvenance }) =>
            runProvenance?.runId === process.env.WIEN_COMBINED_RUN_ID
            && runProvenance?.runAttempt === process.env.WIEN_COMBINED_RUN_ATTEMPT);
          if (run?.status === 'deferred' || run?.diagnostics?.skipImmediateDispatch === true) {
            console.log('Wien Combined reached its quota without collecting fresh Graph posts.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'deferred=true\n');
          }
          JS

      - name: Install Dependencies
        if: steps.wien-combined.outputs.deferred != 'true'
        run: npm ci

      - uses: ./.github/actions/coupon-tools
        if: steps.wien-combined.outputs.deferred != 'true'

      - name: Refresh Instagram merchant registry
        if: steps.wien-combined.outputs.deferred != 'true'
        run: npm run instagram:merchant-registry

      - name: Verify fresh Instagram candidates via Graph API
        if: steps.wien-combined.outputs.deferred != 'true'
        env:
          INSTAGRAM_SHARED_QUOTA_ENABLED: '1'
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          INSTAGRAM_GRAPH_VERIFY_MAX_ACCOUNTS: "6"
          INSTAGRAM_GRAPH_VERIFY_MEDIA_PER_ACCOUNT: "25"
          INSTAGRAM_GRAPH_VERIFY_MAX_AGE_DAYS: "7"
        run: npm run instagram:graph:verify

      - name: Reverify Firecrawl outputs
        if: steps.wien-combined.outputs.deferred != 'true'
        env:
          FIRECRAWL_POST_VERIFY_MAX: "80"
          FIRECRAWL_POST_VERIFY_CONCURRENCY: "4"
          FIRECRAWL_POST_VERIFY_TIMEOUT_MS: "6000"
        run: npm run firecrawl:reverify

      - name: Build Deal Source Health
        if: steps.wien-combined.outputs.deferred != 'true'
        run: node scraper/build-deal-source-health.js

      - name: Build Social Food loss funnel and review candidates
        if: steps.wien-combined.outputs.deferred != 'true'
        env:
          SOCIAL_FOOD_REVIEW_SEND_ALL: '1'
        run: npm run social-food:audit

      - name: Send validated new deals to Slack
        if: steps.wien-combined.outputs.deferred != 'true'
        # Keep malformed Unicode out of Slack block payloads.
        # The regression test runs before any message is sent.
        run: |
          node scripts/test-slack-unicode.mjs
          SENTRY_DISABLED=1 node scripts/test-slack-delivery-state.mjs
          SENTRY_DISABLED=1 node scripts/test-discovery-non-consumer-offers.mjs
          SENTRY_DISABLED=1 node scripts/test-map-location-classification.mjs
          node scripts/test-generated-state-merge.mjs
          SENTRY_DISABLED=1 node scripts/test-slack-directory-recruitment.mjs
          node --test scripts/test-deal-card-editor.mjs scripts/test-card-editor-v2.mjs scripts/test-card-editor-retry.mjs scripts/test-card-editor-disabled.mjs
          SENTRY_DISABLED=1 node --test scripts/test-community-card-enrichment.mjs
          node scripts/test-card-editor-approval.mjs

      - name: Deliver validated new deals to Slack
        if: steps.wien-combined.outputs.deferred != 'true'
        env:
          COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
          COMMUNITY_QUEUE_PATH: .community-internal/queue.json
          SENTRY_DISABLED: '1'
          DEAL_CARD_EDITOR_ENABLED: '0'
          FREEFINDER_DEAL_IMAGE_PILOT: '1'
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DEAL_REMOVE_LINK_SECRET: ${{ secrets.DEAL_REMOVE_LINK_SECRET }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_SEEN_CACHE_MAX_AGE_MINUTES: "10"
          SLACK_SEEN_DEAL_SUPPRESSION_DAYS: "30"
          FIRECRAWL_REVIEW_ENABLED: "1"
          FIRECRAWL_REVIEW_MAX_PER_SOURCE: "10"
          FIRECRAWL_REVIEW_MAX_TOTAL: "30"
          FIRECRAWL_REVIEW_MAX_AGE_DAYS: "7"
          SOCIAL_FOOD_REVIEW_ENABLED: "1"
          SOCIAL_FOOD_REVIEW_SEND_ALL: "1"
          SOCIAL_FOOD_REVIEW_MAX_PER_DAY: "16"
          SOCIAL_FOOD_REVIEW_ARTIFACT_MAX_AGE_HOURS: "12"
        run: |
          node scripts/community-private-state.mjs hydrate
          result=0
          node scraper/slack-notify.js || result=$?
          node scripts/community-private-state.mjs persist
          exit "$result"

      - name: Mark posted community submissions as queued
        if: steps.wien-combined.outputs.deferred != 'true'
        env:
          COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
          COMMUNITY_QUEUE_PATH: .community-internal/queue.json
          SENTRY_DISABLED: '1'
        run: node scraper/ack-community-submissions.js

      - name: Commit dispatch state
        if: ${{ always() && steps.wien-combined.outputs.deferred != 'true' }}
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "Central deal dispatch $(date +%Y-%m-%dT%H:%MZ)" --files docs/deals-pending-all.json docs/deals-pending-gastro2.json docs/deals-pending-food3.json docs/deals-pending-firecrawl2.json docs/deals-pending-firecrawl4.json docs/deals-pending-firecrawl5.json docs/deal-candidates-index.json docs/deal-source-health.json docs/deal-validity-report.json docs/instagram-merchant-registry.json docs/instagram-graph-post-evidence.json docs/instagram-graph-verification-report.json docs/slack-seen-posts.json docs/social-food-candidate-audit.json docs/deals-review-social-food.json docs/social-food-review-state.json docs/deal-review-feedback.json docs/deal-card-editor-cache.json docs/vienna-food-benefit-pause.json docs/carrier-benefit-pause.json
