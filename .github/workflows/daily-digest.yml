name: "Daily Deal Digest"
# Runs once per day after the scheduled scanners have finished.
# Collects the finished pending files and sends ONE Slack digest.

on:
  schedule:
    - cron: '0 10 * * *' # 11:00 Vienna winter / 12:00 summer
  workflow_dispatch:

concurrency:
  group: deal-pending-all-queue
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Refresh Instagram merchant registry
        run: npm run instagram:merchant-registry

      - name: Verify fresh Instagram candidates via Graph API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          INSTAGRAM_GRAPH_VERIFY_MAX_ACCOUNTS: "24"
          INSTAGRAM_GRAPH_VERIFY_MEDIA_PER_ACCOUNT: "25"
          INSTAGRAM_GRAPH_VERIFY_MAX_AGE_DAYS: "7"
        run: npm run instagram:graph:verify

      - name: Build Deal Source Health
        run: node scraper/build-deal-source-health.js

      - name: Send Daily Digest to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FIRECRAWL_REVIEW_ENABLED: "1"
          FIRECRAWL_REVIEW_MAX_PER_SOURCE: "10"
          FIRECRAWL_REVIEW_MAX_TOTAL: "30"
          FIRECRAWL_REVIEW_MAX_AGE_DAYS: "7"
        run: node scraper/slack-notify.js

      - name: Commit digest state
        if: always()
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "Daily digest state $(date +%Y-%m-%d)" --files docs/deals-pending-all.json docs/deal-candidates-index.json docs/deal-source-health.json docs/deal-validity-report.json docs/instagram-merchant-registry.json docs/instagram-graph-post-evidence.json docs/instagram-graph-verification-report.json
