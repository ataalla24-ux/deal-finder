name: Merchant promo tests
on:
  push:
    paths: ['merchant-worker/**', '.github/workflows/merchant-promos-test.yml']
  pull_request:
    paths: ['merchant-worker/**', '.github/workflows/merchant-promos-test.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: merchant-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
