name: "Community Deal Intake"

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Test community extraction and manual review
        run: |
          node --test referrals-worker/test/community-submission.test.js
          node scripts/test-community-extraction.mjs
          node scripts/test-community-review.mjs
          SENTRY_DISABLED=1 node --test scripts/test-community-card-enrichment.mjs

      - name: Process submissions in private storage
        env:
          COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SENTRY_DISABLED: '1'
        run: |
          node scripts/community-private-state.mjs load-intake
          node scraper/fetch-community-submissions.js
          node scripts/community-private-state.mjs save-intake
