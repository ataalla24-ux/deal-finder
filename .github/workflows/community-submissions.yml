name: "Community Deal Intake"

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: community-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch community submissions
        env:
          COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
        run: node scraper/fetch-community-submissions.js

      - name: Commit intake state
        if: always()
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "Community intake state $(date +%Y-%m-%d-%H%M)" --files docs/deals-pending-community.json
