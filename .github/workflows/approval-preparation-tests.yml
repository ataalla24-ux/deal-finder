jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: >-
          node --test scripts/test-approval-source-copy.mjs scripts/test-approved-copy.mjs
          scripts/test-live-deal-duplicates.mjs scripts/test-live-deal-source-consistency.mjs
