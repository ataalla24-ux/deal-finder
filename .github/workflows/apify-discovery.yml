name: Apify 2 Vienna Food Discovery

on:
  workflow_dispatch:

concurrency:
  group: apify-2-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test second-channel cost and secret guards
        run: node --test scripts/test-apify-discovery.mjs
      - name: Read-only credential and included-credit check
        env:
          APIFY_2: ${{ secrets.APIFY_2 }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/check-apify-discovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apify-2-preflight
          path: output/apify-discovery-preflight.json
          retention-days: 7
