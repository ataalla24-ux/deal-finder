name: "Deal Map Reconciliation"

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/deals.json'
      - 'docs/live-deal-edits.json'
      - 'reviews/map-addresses.json'
      - 'reviews/map-chain-rules.json'
      - 'scripts/automatic-deal-maintenance.mjs'
      - 'scripts/live-deal-integrity.mjs'
      - 'scripts/live-deal-duplicates.mjs'
      - 'scripts/live-deal-source-consistency.mjs'
      - 'scripts/test-live-deal-integrity.mjs'
      - 'scripts/test-live-deal-duplicates.mjs'
      - 'scripts/test-live-deal-source-consistency.mjs'
      - 'scripts/test-confirmed-expiry-sweep.mjs'
      - 'reviews/live-deal-integrity-policy.json'
      - 'scripts/approved-expiry-evidence.mjs'
      - 'scripts/expiry-embedded-clock-range.mjs'
      - 'scripts/expiry-original-today.mjs'
      - 'scraper/explicit-offer-period.js'
      - 'scripts/test-automatic-maintenance.mjs'
      - 'scripts/test-approved-expiry-evidence.mjs'
      - 'scripts/test-expiry-*.mjs'
      - 'scripts/test-community-approval-integration.mjs'
      - 'scripts/deal-map-*.mjs'
      - 'scripts/enrich-deal-map.mjs'
      - '.github/workflows/deal-map-sync.yml'

concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  reconcile-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify map safeguards
        run: |
          node --test scripts/test-live-deal-integrity.mjs scripts/test-live-deal-duplicates.mjs scripts/test-live-deal-source-consistency.mjs scripts/test-confirmed-expiry-sweep.mjs
          node --test scripts/test-automatic-maintenance.mjs
          node --test scripts/test-approved-expiry-evidence.mjs scripts/test-expiry-embedded-clock-range.mjs scripts/test-expiry-original-today.mjs scripts/test-expiry-reliability.mjs
          node scripts/test-deal-map-enrichment.mjs
          node scripts/test-map-enrichment-reconciliation.mjs
          node scripts/test-deal-map-chain-rules.mjs
          node scripts/test-map-location-pipeline.mjs
          node scripts/test-map-geocode-fairness.mjs
          node scripts/test-deal-map-source-addresses.mjs
          node scripts/test-deal-map-business.mjs
          node scripts/test-map-commit-consistency.mjs
          node scripts/test-deal-map-review.mjs
          node scripts/test-slack-business-map-review.mjs
          SENTRY_DISABLED=1 node scripts/test-community-approval-integration.mjs
      - name: Audit every live deal against captured API evidence
        env:
          SENTRY_DISABLED: '1'
        run: node scripts/live-deal-integrity.mjs --read-only
      - name: Reconcile published deals and active business campaigns
        env:
          MAP_REFRESH_BUSINESS: '1'
          MAP_SOURCE_REQUESTS: '8'
          MAP_GEOCODE_REQUESTS: '20'
        run: node scripts/enrich-deal-map.mjs
      - name: Validate complete accounting and verified coordinates
        run: |
          node scripts/validate-deal-map-locations.mjs
          node scripts/validate-map-coverage.mjs
      - name: Apply full integrity audit and publish verified feed and map
        run: >-
          node scripts/commit-generated.mjs --message "Reconcile verified deal map locations"
          --files docs/deals.json docs/deal-map-locations.json reviews/map-location-catalog.json
          reviews/map-geocode-cache.json reviews/map-source-address-cache.json
          reviews/map-business-campaigns.json reviews/map-coverage.json reviews/automatic-deal-maintenance-state.json
          reviews/live-deal-integrity-state.json reviews/live-deal-integrity-report.json docs/deal-integrity-status.json
      - name: Preserve complete integrity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deal-integrity-${{ github.run_id }}
          path: |
            reviews/live-deal-integrity-report.json
            docs/deal-integrity-status.json
          if-no-files-found: error
          retention-days: 30
