name: "Meta Instagram Deal Discovery"

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      validation_scan:
        description: 'Bounded live validation: 64 accounts, 80 requests, two AI calls'
        type: boolean
        default: false

concurrency:
  group: meta-instagram-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-deals:
    if: ${{ vars.ENABLE_META_INSTAGRAM_DISCOVERY == '1' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test bounded Graph coverage
        run: |
          npm run test:instagram-graph-scan
          npm run test:instagram-food-discovery
          SENTRY_DISABLED=1 node scripts/test-vienna-merchant-discovery.mjs
          SENTRY_DISABLED=1 node scripts/test-instagram-max-coverage.mjs
          npm run test:instagram-shared-quota
          npm run test:meta-ad-coverage
          npm run test:meta-recall

      - name: Refresh Instagram merchant registry
        run: npm run instagram:merchant-registry

      - name: Check Meta Instagram Graph token
        id: meta_graph_health
        continue-on-error: true
        env:
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
          INSTAGRAM_SHARED_QUOTA_ENABLED: '1'
          INSTAGRAM_SHARED_BUDGET_WAIT_MS: '360000'
          INSTAGRAM_SHARED_BLOCK_SIZE: '1'
          INSTAGRAM_SHARED_ADAPTIVE_MAX_REQUESTS_PER_HOUR: ${{ inputs.validation_scan && '0' || '1000' }}
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_INSTAGRAM_TOKEN_EXPIRES_AT: ${{ vars.META_INSTAGRAM_TOKEN_EXPIRES_AT }}
          META_INSTAGRAM_TAGGED_MEDIA_ENABLED: ${{ vars.META_INSTAGRAM_TAGGED_MEDIA_ENABLED }}
          META_INSTAGRAM_REQUIRE_SOURCE: '1'
        run: npm run instagram:meta:check

      - name: Alert Slack about Meta Graph health
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: npm run instagram:meta:alert

      - name: Stop when Meta Graph health failed
        if: steps.meta_graph_health.outcome == 'failure'
        run: exit 1

      - name: Install Instagram media OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Collect official Meta Instagram deals
        env:
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
          META_AD_LIBRARY_TRY_INSTAGRAM_TOKEN: '1'
          META_AD_LIBRARY_FOOD_ONLY: '1'
          META_AD_LIBRARY_MAX_COVERAGE: '1'
          META_AD_LIBRARY_MAX_TERMS_PER_RUN: '200'
          META_AD_LIBRARY_MAX_PAGES_PER_TERM: '1000'
          META_AD_LIBRARY_PAGE_SIZE: '5000'
          META_AD_LIBRARY_SEED_REQUESTS: ${{ inputs.validation_scan && '4' || '12' }}
          META_AD_LIBRARY_MAX_REQUESTS: ${{ inputs.validation_scan && '16' || '1000' }}
          META_AD_LIBRARY_RUNTIME_MINUTES: '50'
          INSTAGRAM_SHARED_QUOTA_ENABLED: '1'
          INSTAGRAM_SHARED_ADAPTIVE_MAX_REQUESTS_PER_HOUR: ${{ inputs.validation_scan && '0' || '1000' }}
          INSTAGRAM_SHARED_BUDGET_WAIT_MS: '360000'
          INSTAGRAM_SHARED_MIN_INTERVAL_MS: ${{ inputs.validation_scan && '0' || '3000' }}
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_AD_LIBRARY_SEARCH_TERMS: ${{ vars.META_AD_LIBRARY_SEARCH_TERMS }}
          META_INSTAGRAM_HASHTAGS: ${{ vars.META_INSTAGRAM_HASHTAGS }}
          META_INSTAGRAM_ACCOUNTS: ${{ vars.META_INSTAGRAM_ACCOUNTS }}
          META_INSTAGRAM_VERIFIED_ACCOUNTS: ${{ vars.META_INSTAGRAM_VERIFIED_ACCOUNTS }}
          META_INSTAGRAM_TAGGED_MEDIA_ENABLED: ${{ vars.META_INSTAGRAM_TAGGED_MEDIA_ENABLED }}
          META_INSTAGRAM_MAX_COVERAGE: '1'
          META_INSTAGRAM_DISCOVERY_POOL_LIMIT: '5000'
          META_INSTAGRAM_MAX_ACCOUNTS_PER_RUN: ${{ inputs.validation_scan && '64' || '300' }}
          META_INSTAGRAM_FOOD_ACCOUNT_SHARE: '0.9'
          META_INSTAGRAM_MAX_ACCOUNT_BACKFILL: '30'
          META_INSTAGRAM_ACCOUNT_RESCAN_HOURS: '6'
          META_INSTAGRAM_MAX_HASHTAGS_PER_RUN: '8'
          META_INSTAGRAM_MEDIA_PER_ACCOUNT: '25'
          META_INSTAGRAM_MAX_PAGES_PER_SOURCE: '3'
          META_INSTAGRAM_MAX_GRAPH_REQUESTS: ${{ inputs.validation_scan && '80' || '300' }}
          META_INSTAGRAM_GRAPH_USAGE_THRESHOLD: '95'
          META_INSTAGRAM_MAX_POST_AGE_HOURS: '72'
          META_INSTAGRAM_MAX_POST_AGE_WITH_EXPIRY_DAYS: '7'
          META_INSTAGRAM_UNKNOWN_EXPIRY_TTL_HOURS: '72'
          META_INSTAGRAM_MAX_DEALS_PER_RUN: '120'
          META_INSTAGRAM_OUTPUT_ALL_VERIFIED: '1'
          META_INSTAGRAM_SEEN_TTL_DAYS: '7'
          META_INSTAGRAM_ALLOW_WATCHLIST_VIENNA: '0'
          META_INSTAGRAM_REQUIRE_SOURCE: '1'
          META_INSTAGRAM_SOURCE_FAILURE_COOLDOWN_HOURS: '720'
          META_INSTAGRAM_MEDIA_OCR_ENABLED: '1'
          META_INSTAGRAM_MEDIA_MAX_POSTS_PER_RUN: '48'
          META_INSTAGRAM_MEDIA_MAX_ASSETS_PER_POST: '4'
          META_INSTAGRAM_MEDIA_MAX_VIDEO_FRAMES: '4'
          META_INSTAGRAM_MEDIA_OCR_CONCURRENCY: '2'
          META_INSTAGRAM_MEDIA_TESSERACT_TIMEOUT_MS: '10000'
          META_INSTAGRAM_MEDIA_LLM_ENABLED: '1'
          META_INSTAGRAM_MEDIA_VISION_ENABLED: '1'
          META_INSTAGRAM_MEDIA_VISION_MAX_IMAGES_PER_POST: '2'
          META_INSTAGRAM_MEDIA_VISION_DETAIL: 'low'
          META_INSTAGRAM_MEDIA_LLM_MAX_CALLS_PER_RUN: ${{ inputs.validation_scan && '2' || '12' }}
          META_INSTAGRAM_MEDIA_LLM_MAX_CALLS_PER_DAY: '48'
          META_INSTAGRAM_MEDIA_LLM_CONCURRENCY: '1'
        run: node scraper/meta-instagram-deals.js

      - name: Verify factual collector status
        run: node scripts/verify-meta-instagram-report.mjs

      - name: Commit collector state
        if: always()
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "Meta Instagram deals $(date +%Y-%m-%dT%H:%MZ)" --files docs/deals-pending-meta-instagram.json docs/meta-instagram-report.json docs/meta-instagram-auth-health.json docs/meta-instagram-alert-state.json docs/meta-instagram-state.json docs/meta-instagram-scan-state.json docs/instagram-merchant-registry.json docs/instagram-graph-post-evidence.json
