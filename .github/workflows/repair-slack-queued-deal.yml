name: "Repair Queued Slack Deal"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Update from the current source file or delete one queued Slack deal"
        required: true
        default: update
        type: choice
        options:
          - update
          - delete
      deal_url:
        description: "Exact deal URL already posted to Slack"
        required: true
        type: string
      source_file:
        description: "Current source file used for validated updates"
        required: false
        default: "docs/deals-pending-tiktok.json"
        type: string

concurrency:
  group: deal-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair-deal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Test Slack queue repair
        run: node scripts/test-repair-slack-queued-deal.mjs

      - name: Repair exact queued deal
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_QUEUE_REPAIR_ACTION: ${{ inputs.action }}
          SLACK_QUEUE_REPAIR_URL: ${{ inputs.deal_url }}
          SLACK_QUEUE_REPAIR_SOURCE_PATH: ${{ inputs.source_file }}
        run: node scripts/repair-slack-queued-deal.mjs

      - name: Commit repaired queue
        run: node scripts/commit-generated.mjs --message "Repair queued Slack deal" --files docs/deals-pending-all.json
