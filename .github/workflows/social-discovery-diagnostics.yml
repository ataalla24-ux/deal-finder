name: Social Discovery Read-only Diagnostics
on:
  workflow_dispatch:
    inputs:
      lane:
        description: TikTok search, Instagram profile read, or one Instagram public search query
        type: choice
        options: [tiktok, tiktok-direct, tiktok-routes, tiktok-public-ui, tiktok-public-index, tiktok-index-original, instagram, instagram-search]
        default: tiktok
permissions:
  contents: read
jobs:
  public-index:
    if: ${{ inputs.lane == 'tiktok-public-index' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test one free public web index query from the cloud
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import date, timedelta
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          query = {
              'query': 'Wien gratis Essen Rabatt Neueröffnung Döner Pizza Kaffee',
              'include_domains': ['tiktok.com'], 'country': 'austria',
              'start_date': str(date.today() - timedelta(days=7)), 'filter_by_published_date': True,
              'include_published_date': True,
              'max_results': 20, 'search_depth': 'basic', 'include_answer': False,
              'include_raw_content': False, 'auto_parameters': False,
          }
          request = Request('https://api.tavily.com/search', data=json.dumps(query).encode(),
                            headers={'Content-Type': 'application/json', 'X-Tavily-Access-Mode': 'keyless'})
          try:
              with urlopen(request, timeout=25) as res:
                  report = json.loads(res.read(300000))
              rows = report['results']
              videos = {}
              for row in rows:
                  url = urlsplit(row.get('url', ''))
                  match = re.fullmatch(r'/@[\w.]{2,40}/video/(\d{16,22})/?', url.path, re.ASCII)
                  if url.scheme == 'https' and url.netloc in ('www.tiktok.com', 'tiktok.com', 'm.tiktok.com') and match:
                      videos[match[1]] = {'url': 'https://www.tiktok.com' + url.path.rstrip('/'),
                                          'indexDate': row.get('published_date', ''),
                                          'title': str(row.get('title', ''))[:160]}
              print(json.dumps({'status': 200, 'indexRows': len(rows), 'uniquePublicVideoUrls': len(videos),
                                'videos': list(videos.values())}))
          except HTTPError as error:
              print(json.dumps({'status': error.code, 'retryAfter': error.headers.get('Retry-After')}))
          PY

  check-index-original:
    if: ${{ inputs.lane == 'tiktok-index-original' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENTRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - name: Check one ordinary public video discovered by the cloud index
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import { extractTikTokPostData, buildDealFromPost } from './scraper/tiktok-deals-scanner.js';

          const previous = JSON.parse(fs.readFileSync('docs/tiktok-scanner-report.json', 'utf8'));
          const retryAt = Math.max(0, ...[
            previous.apiDiscovery?.nextRetryAt, previous.apiDiscovery?.postVisitStop?.retryAt,
            previous.searchDiscovery?.postVisitStop?.retryAt,
          ].map(value => Date.parse(value) || 0));
          if (retryAt > Date.now()) {
            console.log(JSON.stringify({ status: 'cooldown', originalRead: 0, retryAt: new Date(retryAt).toISOString() }));
          } else {
            const url = 'https://www.tiktok.com/@nico.realrating/video/7709913443947728131';
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ locale: 'de-AT', timezoneId: 'Europe/Vienna' });
              const evidence = await extractTikTokPostData(page, url);
              const { deal, reason } = evidence.url ? buildDealFromPost(url, evidence) : {};
              console.log(JSON.stringify({
                url, originalRead: Number(Boolean(evidence.url)), publicationDate: evidence.timeDateTime || '',
                reason: evidence.accessRefusal?.transportReason || reason || '',
                title: deal?.title || '', starts: deal?.validFrom || '', expires: deal?.expires || '',
              }));
            } finally {
              await browser.close();
            }
          }
          JS

  diagnose:
    if: ${{ inputs.lane == 'tiktok' || inputs.lane == 'tiktok-routes' || inputs.lane == 'tiktok-public-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SENTRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify dependency isolation and search contracts offline
        run: node --test scripts/test-lightweight-state-committer.mjs scripts/test-social-search-reliability.mjs scripts/test-tiktok-browser-search.mjs scripts/test-instagram-delivery-audit.mjs
      - name: Probe at most one TikTok API search and one public search, without secrets
        if: ${{ inputs.lane == 'tiktok' }}
        run: node scripts/check-social-discovery.mjs
      - name: Inspect one public search page while blocking all search data calls
        if: ${{ inputs.lane == 'tiktok-routes' }}
        run: node scripts/check-tiktok-search-routes.mjs
      - name: Observe one normal public search page without signing in
        if: ${{ inputs.lane == 'tiktok-public-ui' }}
        run: node scripts/check-tiktok-search-routes.mjs --public-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-discovery-diagnostics
          path: |
            output/social-discovery/probe.json
            output/social-discovery/tiktok-routes.json
          retention-days: 7

  instagram:
    if: ${{ inputs.lane == 'instagram' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SENTRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify profile rendering with local fixtures
        run: node --test scripts/test-instagram-profile-browser.mjs
      - name: Run the bounded Instagram profile collector without publishing its files
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: node scripts/check-instagram-web-discovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-web-diagnostics
          path: output/social-discovery/instagram-web.json
          retention-days: 7

  instagram-search:
    if: ${{ inputs.lane == 'instagram-search' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: instagram-ai-scan
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Search once and verify up to three previously unknown links
        id: search
        run: node scripts/check-instagram-search-discovery.mjs
      - name: Persist the result of the real attempt
        if: ${{ always() && steps.search.outputs.attempted == 'true' }}
        run: node scripts/commit-generated.mjs --message "Record bounded Instagram search retry [skip ci]" --files docs/instagram-ai-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-search-diagnostics
          path: output/social-discovery/instagram-search.json
          retention-days: 7

  tiktok-direct:
    if: ${{ inputs.lane == 'tiktok-direct' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: tiktok-deal-scan
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SENTRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Search once through TikTok directly
        id: search
        run: node scripts/check-tiktok-direct-discovery.mjs
      - name: Persist the result of the real attempt
        if: ${{ always() && steps.search.outputs.attempted == 'true' }}
        run: node scripts/commit-generated.mjs --message "Record bounded TikTok search retry [skip ci]" --files docs/tiktok-scanner-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-direct-diagnostics
          path: output/social-discovery/tiktok-direct.json
          retention-days: 7
