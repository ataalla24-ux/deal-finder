name: "Power Scraper"

on:
  schedule:
    - cron: '30 5,13 * * *' # Morning and afternoon refresh (UTC)
  workflow_dispatch:

concurrency:
  group: power-scraper
  cancel-in-progress: false

jobs:
  scrape-power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browser fallback
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Test official food discovery
        env:
          SENTRY_DISABLED: '1'
        run: |
          node scripts/test-power-scraper.mjs
          node scripts/test-power-food.mjs

      - name: Run Power Scraper
        env:
          POWER_INCLUDE_BASE_DEALS: '0'
          POWER_FETCH_TIMEOUT_MS: '8000'
          POWER_FETCH_CONCURRENCY: '4'
          POWER_MAX_DEALS_PER_SOURCE: '25'
          POWER_FOOD_MAX_PAGES: '5'
          POWER_BROWSER_FALLBACK: '1'
        run: node scraper/power-scraper.js

      - name: Commit pending power deals
        run: |
          node scripts/commit-generated.mjs --message "Refresh power deals $(date +%Y-%m-%d)" --files docs/deals-pending-power.json docs/power-scraper-report.json docs/deal-pipeline-last-run-power.json docs/deal-pipeline-runs-power.json
