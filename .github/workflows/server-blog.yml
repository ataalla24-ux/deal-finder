name: Server Blog
on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/server-blog-*.mjs'
      - 'scripts/test-server-blog*.mjs'
      - 'scripts/verify-server-blog-public.mjs'
      - 'scripts/vienna-blog-slot.mjs'
      - '.github/workflows/server-blog.yml'
permissions:
  contents: write
concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max
jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: slot
        env:
          BLOG_CRON: ${{ github.event.schedule }}
        run: node scripts/vienna-blog-slot.mjs
      - if: steps.slot.outputs.run == 'true'
        run: npm ci
      - name: Check publication, source and concurrency safeguards
        if: steps.slot.outputs.run == 'true'
        run: |
          node --test scripts/test-server-blog.mjs scripts/test-server-blog-publication.mjs scripts/test-server-blog-revision.mjs scripts/test-lightweight-state-committer.mjs
          node scripts/test-queue-workflow-safety.mjs
      - name: Refresh bounded official evidence only if today needs editorial work
        if: steps.slot.outputs.run == 'true'
        run: node scripts/refresh-maintenance-evidence.mjs --blog-day
      - name: Prepare one independently verified full guide revision
        if: steps.slot.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/server-blog-publish.mjs
      - name: Validate website and generated output
        if: steps.slot.outputs.run == 'true'
        run: |
          node scripts/test-website-quality.mjs
          git diff --check
      - name: Commit complete guarded publication or review-only result
        if: steps.slot.outputs.run == 'true'
        run: >-
          node scripts/commit-generated.mjs --message "Server verified blog update"
          --files 'docs/blog/*.html' docs/sitemap.xml
          reviews/server-blog-state.json reviews/server-blog-report.json
          reviews/server-blog-publications.json reviews/server-blog-publication-batch.json
          'reviews/*-daily-blog.json'
          reviews/maintenance-source-evidence.json reviews/maintenance-source-report.json
          docs/carrier-benefit-pause.json
      # Actual readback follows a successful Pages deployment in Server Blog Publication.
      # A completed writer is not evidence that a new article is public.
      - name: Preserve draft, evidence and publication receipt
        if: ${{ always() && steps.slot.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-blog-${{ github.run_id }}
          path: |
            reviews/server-blog-report.json
            reviews/server-blog-state.json
            reviews/server-blog-publications.json
            reviews/server-blog-publication-batch.json
            reviews/server-blog-public-receipt.json
            reviews/maintenance-source-report.json
            output/server-blog-public-proof.json
          retention-days: 30
