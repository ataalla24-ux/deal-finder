name: Repository Safety

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/test-workflow-permissions.rb', 'scripts/*launch-readiness.mjs', 'scripts/*secret-guard.mjs', 'scripts/instagram-session-audit.mjs']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/test-workflow-permissions.rb', 'scripts/*launch-readiness.mjs', 'scripts/*secret-guard.mjs', 'scripts/instagram-session-audit.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/test-workflow-permissions.rb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-launch-readiness.mjs
      - run: node --test scripts/test-repository-secret-guard.mjs
      - name: Reject session exports and private runtime files in the public tree
        run: node scripts/repository-secret-guard.mjs
      - name: Read-only operations overview
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/check-launch-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: launch-readiness
          path: output/launch-readiness.json
