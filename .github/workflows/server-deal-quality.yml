name: Server Deal Quality
on:
  schedule:
    - cron: '13 12,20 * * *'
      timezone: Europe/Vienna
    - cron: '43 14,22 * * *'
      timezone: Europe/Vienna
    - cron: '37 5,8,11,14,17,20,23 17-20 11 *'
  workflow_dispatch:
    inputs:
      deal_id:
        description: Optional live deal ID for a single source-backed Sol draft and Astra verification
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/deals.json'
      - 'docs/live-deal-edits.json'
      - 'scripts/automatic-deal-maintenance.mjs'
      - 'scripts/cheapest-city-flights.mjs'
      - 'scraper/vienna-flight-offer.js'
      - 'scripts/test-cheapest-city-flights.mjs'
      - 'scripts/original-social-copy.mjs'
      - 'scripts/test-original-social-copy.mjs'
      - 'scripts/server-quality-audit.mjs'
      - 'scripts/server-operations-report.mjs'
      - 'scripts/source-publication-yield.mjs'
      - 'scripts/vienna-quality-slot.mjs'
      - 'scripts/server-blog-draft.mjs'
      - 'scripts/native-contract-observation.mjs'
      - 'reviews/native-contract-observation.json'
      - 'scripts/native-artwork-review.mjs'
      - 'scripts/original-deal-photo.mjs'
      - 'scripts/automatic-deal-photos.mjs'
      - 'scripts/test-automatic-deal-photos.mjs'
      - 'scripts/prepare-deal-photo.mjs'
      - 'scripts/deal-photo-contract.mjs'
      - 'scripts/live-deal-edits-lib.mjs'
      - 'scripts/validate-original-deal-photos.mjs'
      - 'reviews/deal-photos/**'
      - 'docs/assets/approved-deal-photos/**'
      - 'reviews/native-artwork-observation.json'
      - 'reviews/native-artwork/**'
      - 'scripts/refresh-maintenance-evidence.mjs'
      - 'scripts/refresh-food-redemptions.mjs'
      - 'scripts/food-redemption-sources.mjs'
      - 'scripts/test-food-redemption-refresh.mjs'
      - 'scripts/test-food-redemption-sources.mjs'
      - 'reviews/deal-redemptions.json'
      - 'scraper/ai-credit-budget.js'
      - 'reviews/ai-credit-policy.json'
      - 'scripts/verify-server-quality-public.mjs'
      - 'scraper/source-backed-quality.js'
      - 'reviews/automatic-maintenance-policy.json'
      - '.github/workflows/server-deal-quality.yml'
permissions:
  contents: write
concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max
jobs:
  review-one-deal:
    if: github.event_name == 'workflow_dispatch' && inputs.deal_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-ai-credit-budget.mjs scripts/test-live-deal-enrichment.mjs
      - name: Review one existing live deal with Sol and Astra
        env:
          MAINTENANCE_TARGET_DEAL_ID: ${{ inputs.deal_id }}
          AUTOMATIC_MAINTENANCE_APPLY: '1'
          FREEFINDER_ASTRA_ENRICHMENT: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-deal-maintenance.mjs
      - name: Commit source-verified deal changes
        run: >-
          node scripts/commit-generated.mjs --message "Review one live offer against source evidence"
          --files docs/deals.json reviews/automatic-deal-maintenance-state.json

  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.deal_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: slot
        env:
          QUALITY_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/vienna-quality-slot.mjs
      - name: Report a skipped scheduled trigger
        if: steps.slot.outputs.run == 'false'
        run: |
          echo 'Kein neuer Qualitaetslauf: Zeitfenster bereits abgeschlossen oder Guthabenzeitraum beendet.' >> "$GITHUB_STEP_SUMMARY"
      - if: steps.slot.outputs.run == 'true'
        run: npm ci
      - name: Verify safe correction and preservation rules
        if: steps.slot.outputs.run == 'true'
        run: |
          node --test scripts/test-ai-credit-budget.mjs scripts/test-automatic-maintenance.mjs scripts/test-cheapest-city-flights.mjs scripts/test-live-deal-enrichment.mjs scripts/test-server-quality.mjs scripts/test-server-operations.mjs scripts/test-source-publication-yield.mjs scripts/test-server-blog.mjs scripts/test-lightweight-state-committer.mjs scripts/test-native-artwork-review.mjs scripts/test-server-quality-publication-workflow.mjs
          node scripts/test-pre-publication-title.mjs
          node --test scripts/test-original-social-copy.mjs scripts/test-food-redemption-refresh.mjs scripts/test-food-redemption-sources.mjs
          node scripts/test-deal-photo-contract.mjs
          node --test scripts/test-original-deal-photos.mjs
          node --test scripts/test-automatic-deal-photos.mjs
          node scripts/validate-original-deal-photos.mjs
          node scripts/test-queue-workflow-safety.mjs
      - name: Refresh conditions from known official offer pages
        if: steps.slot.outputs.run == 'true'
        env:
          FREEFINDER_ASTRA_ENRICHMENT: ${{ github.event_name != 'push' && '1' || '0' }}
        run: node scripts/refresh-maintenance-evidence.mjs --food-redemptions
      - name: Maintain source-backed text and explicit expiry
        if: steps.slot.outputs.run == 'true'
        env:
          AUTOMATIC_MAINTENANCE_APPLY: '1'
          FREEFINDER_ASTRA_ENRICHMENT: ${{ github.event_name != 'push' && '1' || '0' }}
          OPENAI_API_KEY: ${{ github.event_name != 'push' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-deal-maintenance.mjs
      - name: Replace fallback artwork for exact documented matches
        if: steps.slot.outputs.run == 'true'
        env:
          FREEFINDER_ASTRA_ENRICHMENT: ${{ github.event_name != 'push' && '1' || '0' }}
          OPENAI_API_KEY: ${{ github.event_name != 'push' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-deal-photos.mjs ${{ github.event_name != 'push' && '--apply' || '' }}
      - name: Refresh published redemption instructions from existing official food evidence
        if: steps.slot.outputs.run == 'true'
        run: node scripts/refresh-food-redemptions.mjs
      - name: Keep only the cheapest active approved flight per city
        if: steps.slot.outputs.run == 'true'
        run: node scripts/cheapest-city-flights.mjs
      - name: Reconcile locations from verified sources
        if: steps.slot.outputs.run == 'true'
        env:
          MAP_REFRESH_BUSINESS: '0'
          MAP_SOURCE_REQUESTS: ${{ github.event_name != 'push' && '8' || '0' }}
          MAP_GEOCODE_REQUESTS: ${{ github.event_name != 'push' && '20' || '0' }}
        run: |
          node scripts/enrich-deal-map.mjs
          node scripts/validate-deal-map-locations.mjs
          node scripts/validate-map-coverage.mjs
      - name: Check source, copy, images and automatic-publication readiness
        if: steps.slot.outputs.run == 'true'
        env:
          FREEFINDER_ASTRA_ENRICHMENT: ${{ github.event_name != 'push' && '1' || '0' }}
          OPENAI_API_KEY: ${{ github.event_name != 'push' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/server-quality-audit.mjs
      - name: Record recovery queue, shadow pilot and bounded credit usage
        if: steps.slot.outputs.run == 'true'
        env:
          FREEFINDER_ASTRA_ENRICHMENT: ${{ github.event_name != 'push' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_SLOT: ${{ steps.slot.outputs.slot }}
        run: node scripts/server-operations-report.mjs
      - name: Commit guarded maintenance and audit
        if: steps.slot.outputs.run == 'true'
        run: >-
          node scripts/commit-generated.mjs --message "Server source-backed quality maintenance"
          --files docs/deals.json docs/automatic-deal-maintenance-report.json
          docs/live-deal-edits.json 'docs/assets/approved-deal-photos/*.jpg' 'reviews/deal-photos/*.json'
          reviews/deal-redemptions.json reviews/automatic-deal-maintenance-state.json reviews/server-quality-audit.json
          reviews/server-photo-audit-cache.json docs/deal-map-locations.json
          reviews/maintenance-source-evidence.json reviews/maintenance-source-report.json
          reviews/server-operations-report.json reviews/server-operations-report.md
          reviews/automatic-publication-pilot.json reviews/automatic-publication-review-pack.json docs/carrier-benefit-pause.json
          reviews/map-coverage.json reviews/map-location-catalog.json reviews/map-geocode-cache.json
          reviews/map-source-address-cache.json reviews/map-business-campaigns.json
      - name: Separate completed quality work from pending publication
        if: steps.slot.outputs.run == 'true'
        run: |
          echo 'Qualitaetspruefung abgeschlossen; oeffentliche Veroeffentlichung separat durch Server Quality Publication nach erfolgreichem Pages-Deployment pruefen. Ein gruener Qualitaetslauf ist kein Veroeffentlichungsnachweis.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence for review
        if: ${{ always() && steps.slot.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-quality-${{ github.run_id }}
          path: |
            reviews/server-quality-audit.json
            docs/automatic-deal-maintenance-report.json
            reviews/automatic-deal-maintenance-state.json
            reviews/map-coverage.json
            reviews/maintenance-source-report.json
            reviews/server-operations-report.json
            reviews/server-operations-report.md
            reviews/automatic-publication-pilot.json
            reviews/automatic-publication-review-pack.json
            reviews/server-blog-report.json
            reviews/native-contract-observation.json
            reviews/native-artwork-observation.json
          retention-days: 30
