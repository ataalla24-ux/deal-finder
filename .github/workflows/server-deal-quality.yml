name: Server Deal Quality
on:
  schedule:
    - cron: '13 12,20 * * *'
      timezone: Europe/Vienna
    - cron: '43 14,22 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/deals.json'
      - 'docs/live-deal-edits.json'
      - 'scripts/automatic-deal-maintenance.mjs'
      - 'scripts/server-quality-audit.mjs'
      - 'scripts/server-operations-report.mjs'
      - 'scripts/vienna-quality-slot.mjs'
      - 'scripts/server-blog-draft.mjs'
      - 'scripts/native-contract-observation.mjs'
      - 'reviews/native-contract-observation.json'
      - 'scripts/native-artwork-review.mjs'
      - 'scripts/original-deal-photo.mjs'
      - 'scripts/prepare-deal-photo.mjs'
      - 'scripts/deal-photo-contract.mjs'
      - 'scripts/live-deal-edits-lib.mjs'
      - 'scripts/validate-original-deal-photos.mjs'
      - 'reviews/deal-photos/**'
      - 'docs/assets/approved-deal-photos/**'
      - 'reviews/native-artwork-observation.json'
      - 'reviews/native-artwork/**'
      - 'scripts/refresh-maintenance-evidence.mjs'
      - 'scraper/ai-credit-budget.js'
      - 'scripts/verify-server-quality-public.mjs'
      - 'scraper/source-backed-quality.js'
      - 'reviews/automatic-maintenance-policy.json'
      - '.github/workflows/server-deal-quality.yml'
permissions:
  contents: write
concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: slot
        run: node scripts/vienna-quality-slot.mjs
      - name: Report a duplicate scheduled trigger
        if: steps.slot.outputs.run == 'false'
        run: |
          echo 'Kein neuer Qualitaetslauf: dieses Wiener Zeitfenster ist bereits abgeschlossen.' >> "$GITHUB_STEP_SUMMARY"
      - if: steps.slot.outputs.run == 'true'
        run: npm ci
      - name: Verify safe correction and preservation rules
        if: steps.slot.outputs.run == 'true'
        run: |
          node --test scripts/test-ai-credit-budget.mjs scripts/test-automatic-maintenance.mjs scripts/test-server-quality.mjs scripts/test-server-operations.mjs scripts/test-server-blog.mjs scripts/test-lightweight-state-committer.mjs scripts/test-native-artwork-review.mjs scripts/test-server-quality-publication-workflow.mjs
          node scripts/test-pre-publication-title.mjs
          node scripts/test-deal-photo-contract.mjs
          node --test scripts/test-original-deal-photos.mjs
          node scripts/validate-original-deal-photos.mjs
          node scripts/test-queue-workflow-safety.mjs
      - name: Refresh conditions from known official offer pages
        if: steps.slot.outputs.run == 'true'
        run: node scripts/refresh-maintenance-evidence.mjs
      - name: Maintain source-backed text and explicit expiry
        if: steps.slot.outputs.run == 'true'
        env:
          AUTOMATIC_MAINTENANCE_APPLY: '1'
          OPENAI_API_KEY: ${{ github.event_name != 'push' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-deal-maintenance.mjs
      - name: Reconcile map using verified caches only
        if: steps.slot.outputs.run == 'true'
        env:
          MAP_REFRESH_BUSINESS: '0'
          MAP_SOURCE_REQUESTS: '0'
          MAP_GEOCODE_REQUESTS: '0'
        run: |
          node scripts/enrich-deal-map.mjs
          node scripts/validate-deal-map-locations.mjs
          node scripts/validate-map-coverage.mjs
      - name: Check source, copy, images and automatic-publication readiness
        if: steps.slot.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ github.event_name != 'push' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/server-quality-audit.mjs
      - name: Record recovery queue, shadow pilot and bounded credit usage
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_SLOT: ${{ steps.slot.outputs.slot }}
        run: node scripts/server-operations-report.mjs
      - name: Commit guarded maintenance and audit
        if: steps.slot.outputs.run == 'true'
        run: >-
          node scripts/commit-generated.mjs --message "Server source-backed quality maintenance"
          --files docs/deals.json docs/automatic-deal-maintenance-report.json
          reviews/automatic-deal-maintenance-state.json reviews/server-quality-audit.json
          reviews/server-photo-audit-cache.json docs/deal-map-locations.json
          reviews/maintenance-source-evidence.json reviews/maintenance-source-report.json
          reviews/server-operations-report.json reviews/server-operations-report.md
          reviews/automatic-publication-pilot.json reviews/automatic-publication-review-pack.json docs/carrier-benefit-pause.json
          reviews/map-coverage.json reviews/map-location-catalog.json reviews/map-geocode-cache.json
          reviews/map-source-address-cache.json reviews/map-business-campaigns.json
      - name: Separate completed quality work from pending publication
        if: steps.slot.outputs.run == 'true'
        run: |
          echo 'Qualitaetspruefung abgeschlossen; oeffentliche Veroeffentlichung separat durch Server Quality Publication nach erfolgreichem Pages-Deployment pruefen. Ein gruener Qualitaetslauf ist kein Veroeffentlichungsnachweis.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence for review
        if: ${{ always() && steps.slot.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-quality-${{ github.run_id }}
          path: |
            reviews/server-quality-audit.json
            docs/automatic-deal-maintenance-report.json
            reviews/automatic-deal-maintenance-state.json
            reviews/map-coverage.json
            reviews/maintenance-source-report.json
            reviews/server-operations-report.json
            reviews/server-operations-report.md
            reviews/automatic-publication-pilot.json
            reviews/automatic-publication-review-pack.json
            reviews/server-blog-report.json
            reviews/native-contract-observation.json
            reviews/native-artwork-observation.json
          retention-days: 30
