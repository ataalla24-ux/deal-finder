name: Server Blog Publication
on:
  workflow_run:
    workflows: ['pages-build-deployment']
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: deal-state-writer
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify actual public article, preview and sitemap
        timeout-minutes: 5
        run: node scripts/verify-server-blog-public.mjs
      - name: Record only a newly verified publication receipt
        run: >-
          node scripts/commit-generated.mjs --message "Record verified server blog publication"
          --files reviews/server-blog-public-receipt.json
      - name: Keep public proof, including unavailable or mismatched documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-blog-publication-${{ github.run_id }}
          path: output/server-blog-public-proof.json
          if-no-files-found: error
          retention-days: 30
