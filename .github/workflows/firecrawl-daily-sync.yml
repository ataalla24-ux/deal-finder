name: "Firecrawl Daily Sync"

on:
  schedule:
    - cron: '20 5 * * *' # Keep this source pass spaced out from cookie refresh and Apify.
  workflow_dispatch:
    inputs:
      joe_only:
        description: 'Run only the free jö/OMV source check and commit its candidates/reports'
        type: boolean
        default: false

concurrency:
  group: firecrawl-daily-sync
  cancel-in-progress: false

jobs:
  scrape-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Verify Playwright Chromium
        run: |
          node -e "const { chromium } = require('playwright'); (async()=>{const b=await chromium.launch({headless:true}); await b.close(); console.log('playwright-ok');})().catch(e=>{console.error(e); process.exit(1);});"

      - name: Load jö Auth State
        env:
          JOE_STORAGE_STATE_B64: ${{ secrets.JOE_STORAGE_STATE_B64 }}
        run: node scripts/load-joe-auth-state.mjs

      - name: Build Instagram Merchant Registry
        if: ${{ !inputs.joe_only }}
        run: node scraper/build-instagram-merchant-registry.js

      - name: Respect saved Instagram web cooldowns
        if: ${{ !inputs.joe_only }}
        id: instagram-access
        env:
          SENTRY_DISABLED: "1"
        run: node scraper/instagram-daily-sync.js --access-preflight

      - name: Check Instagram Auth
        if: ${{ steps.instagram-access.outputs.proceed == 'true' }}
        id: instagram-auth
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_AUTH_CONTEXT: Firecrawl Daily Sync
          INSTAGRAM_AUTH_METHOD: own-profile-ui
          INSTAGRAM_AUTH_ATTEMPTS: "1"
          SENTRY_DISABLED: "1"
          INSTAGRAM_AUTH_CLEAR_PENDING_ON_FAILURE: "0"
          INSTAGRAM_AUTH_CLEAR_MODE: daily-sync
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node scripts/check-instagram-auth.mjs

      - name: Run Instagram Daily Sync
        if: ${{ steps.instagram-access.outputs.proceed == 'true' && steps.instagram-auth.outputs.ok == 'true' }}
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          IG_MAX_AGE_DAYS: 7
          IG_MAX_DEALS: 800
          IG_MAX_SOURCES_TOTAL: 220
          IG_MAX_TIMELINE_POSTS: 4
          IG_MAX_REGISTRY_ACCOUNTS: 220
          IG_MIN_SCORE: 0
          IG_MAX_DEALS_PER_ACCOUNT: 120
          IG_SOURCE_DELAY_MS: 1800
          IG_MAX_RUN_MINUTES: 80
        run: |
          node scraper/instagram-daily-sync.js

      - name: Run jö Scraper
        run: |
          SENTRY_DISABLED=1 node --test scripts/test-joe-current-offers.mjs
          node scraper/joe-scraper.js

      - name: Run Vienna Promo Radar
        if: ${{ !inputs.joe_only }}
        run: node scraper/vienna-promo-radar.js

      - name: Commit deal updates
        run: |
          if [ '${{ inputs.joe_only }}' = 'true' ]; then
            node scripts/commit-generated.mjs --skip-conflicts --message "jo OMV source check $(date +%Y-%m-%dT%H:%MZ)" --files docs/deals-pending-joe.json docs/joe-scraper-report.json docs/deal-pipeline-last-run-joe.json docs/deal-pipeline-runs-joe.json
          else
            node scripts/commit-generated.mjs --skip-conflicts --message "Daily sync sources $(date +%Y-%m-%d)" --files docs/deals-pending-instagram.json docs/deals-pending-instagram-web.json docs/deals-pending-instagram-discovery.json docs/deals-pending-joe.json docs/joe-scraper-report.json docs/deal-pipeline-last-run-joe.json docs/deal-pipeline-runs-joe.json docs/deals-pending-vienna-promo-radar.json docs/instagram-source-stats.json docs/instagram-discovery-report.json docs/instagram-web-report.json docs/instagram-merchant-registry.json docs/instagram-auth-health.json
          fi
