name: "TikTok Deal Scanner"
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.browsed_posts != '' && 'TikTok browser candidate import' || github.workflow }}

on:
  schedule:
    - cron: '15 5,17 * * *'
  workflow_dispatch:
    inputs:
      text_only:
        description: Run the scanner using public text evidence without paid model calls
        type: boolean
        default: true
      legacy_search:
        description: Enable the older direct TikTok search for this manual run
        type: boolean
        default: false
      tavily_index:
        description: Search the free cached Tavily index for recent TikTok links
        type: boolean
        default: false
      skip_web_search:
        description: Skip DuckDuckGo for this run while retaining its saved retry state
        type: boolean
        default: false
      browsed_posts:
        description: Public post captions from the authorized local TikTok browser
        type: string
        default: ''

concurrency:
  group: tiktok-deal-scan
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  scan-deals:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.browsed_posts == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      TIKTOK_MAX_AGE_DAYS: 7
      TIKTOK_MAX_POSTS: 120
      TIKTOK_MAX_DEALS: 50
      TIKTOK_SEARCH_PAGES: 3
      TIKTOK_SEARCH_COUNT: 30
      TIKTOK_MAX_API_CANDIDATES: 1200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Test TikTok scanner
        run: |
          npm run test:tiktok-deal-scanner
          node --test scripts/test-tiktok-known-links.mjs scripts/test-social-search-reliability.mjs scripts/test-tiktok-opening-merchant.mjs scripts/test-tavily-free-budget.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Inspect TikTok media OCR tools
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.text_only == false }}
        id: media_tools
        run: node scripts/coupon-tools-preflight.mjs --social-media

      - name: Install missing TikTok media OCR tools
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.text_only == false && steps.media_tools.outputs.available != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          MISSING_PACKAGES: ${{ steps.media_tools.outputs.packages }}
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends $MISSING_PACKAGES

      - name: Scan current TikTok deals
        env:
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.text_only == false && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
          TIKTOK_PUBLIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_search && '0' || '1' }}
          TIKTOK_TAVILY_INDEX_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.tavily_index) || vars.TIKTOK_TAVILY_INDEX_ENABLED == '1' }}
          TIKTOK_TAVILY_FREE_PLAN_CONFIRMED: ${{ vars.TIKTOK_TAVILY_FREE_PLAN_CONFIRMED }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.TAVIILY_API_KEY }}
          TIKTOK_SKIP_WEB_SEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_web_search }}
          TIKTOK_MEDIA_MAX_AGE_HOURS: '72'
          TIKTOK_MEDIA_MAX_POSTS_PER_RUN: '16'
          TIKTOK_MEDIA_MAX_ASSETS_PER_POST: '3'
          TIKTOK_MEDIA_MAX_VIDEO_FRAMES: '2'
          TIKTOK_MEDIA_TESSERACT_TIMEOUT_MS: '8000'
          TIKTOK_MEDIA_VISION_MAX_IMAGES_PER_POST: '2'
          TIKTOK_MEDIA_LLM_MAX_CALLS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.text_only == false && '8' || '0' }}
          TIKTOK_MEDIA_LLM_CONCURRENCY: '2'
          TIKTOK_MEDIA_LLM_MIN_CONFIDENCE: '0.84'
          TIKTOK_MEDIA_VISION_DETAIL: 'low'
        run: node scraper/tiktok-deals-scanner.js

      - name: Commit TikTok scanner state
        if: always()
        run: |
          node scripts/commit-generated.mjs --skip-conflicts --message "TikTok deals $(date +%Y-%m-%d)" --files docs/deals-pending-tiktok.json docs/tiktok-scanner-report.json docs/tiktok-media-evidence-cache.json

  import-browser-posts:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browsed_posts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Test the bounded browser importer
        run: node --test scripts/test-tiktok-browser-import.mjs
      - name: Import public posts as pending candidates
        id: browser_import
        run: node scripts/import-tiktok-browser-posts.mjs
      - name: Commit new TikTok browser candidates
        if: steps.browser_import.outputs.changed == 'true'
        run: node scripts/commit-generated.mjs --message "Import TikTok browser candidates [skip ci]" --files docs/deals-pending-tiktok-browser.json
