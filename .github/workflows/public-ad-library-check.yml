name: Public Instagram Ads Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ad-library-access-check
  cancel-in-progress: false

jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test public search without accounts or Slack messages
        run: node scripts/probe-public-ad-library.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ad-library-access
          path: artifacts/public-ad-library-access.json
          retention-days: 7
