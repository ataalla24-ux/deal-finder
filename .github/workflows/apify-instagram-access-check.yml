name: Apify Instagram Read-only Access Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apify-instagram-access-check.yml'
      - 'scripts/check-apify-instagram-access.mjs'
      - 'scripts/test-apify-instagram-access.mjs'

permissions:
  contents: read

concurrency:
  group: apify-instagram-access-check
  cancel-in-progress: false

jobs:
  check-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test metadata-only access probe offline
        run: node --test scripts/test-apify-instagram-access.mjs
      - name: Read account and Actor metadata only
        if: github.event_name == 'workflow_dispatch'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_INSTAGRAM_VIENNA_ACTOR_ID: ${{ secrets.APIFY_INSTAGRAM_VIENNA_ACTOR_ID }}
        run: node scripts/check-apify-instagram-access.mjs
